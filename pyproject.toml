[project]
name = "timecards"
version = "0.1.0"
description = "Fill, review and submit ServiceNow time cards from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "textual>=0.80",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
tc = "timecards.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
